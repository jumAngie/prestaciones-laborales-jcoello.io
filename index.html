:root{--green:#183f36;--gold:#b58b48;--bg:#f4f6f3;--ink:#20382f;--muted:#69766e;--line:#dce4dd}*{box-sizing:border-box}body{margin:0;font:15px/1.55 'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:10px 16px;background:white;color:var(--ink);font-weight:600}button:hover{background:#e9eee9}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#285b4e}h1,h2,h3,p{margin:0 0 12px}h1{font-size:32px;letter-spacing:-1px}h2{font-size:21px}h3{font-size:16px}small,.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;color:var(--gold)}.card{background:white;border:1px solid var(--line);padding:25px;border-radius:15px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.metric{border-top:3px solid var(--gold)}.metric strong{display:block;font-size:28px;margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:white;border-right:1px solid var(--line);padding:24px 18px;display:flex;flex-direction:column}.logo{width:180px;height:115px;object-fit:cover;display:block;margin:0 auto 20px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{text-align:left;border:0;background:transparent;padding:13px;display:flex;align-items:center;gap:12px}.nav button.active{background:var(--green);color:white}.nav svg{width:19px;height:19px;flex-shrink:0}.bottom{margin-top:auto}.topbar{height:82px;background:#ffffffdf;border-bottom:1px solid var(--line);padding:20px 34px;display:flex;justify-content:space-between;align-items:center}.avatar{background:#e8eee8;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-weight:bold}main{max-width:1320px;margin:auto;padding:34px}.field{margin-bottom:16px}label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #bfcfc3;border-radius:8px;padding:11px;background:white;color:var(--ink)}input:focus,select:focus,button:focus-visible,textarea:focus{outline:3px solid #b58b4880;outline-offset:2px}input[readonly]{background:var(--bg)}.note{background:#fcf8ef;border-left:3px solid var(--gold);padding:14px 18px;margin-bottom:20px;font-size:13px}.pill{display:inline-block;border-radius:20px;background:#e8f0e9;color:var(--green);padding:4px 10px;font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.7px}.money{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.total{background:var(--green);color:white;padding:30px;border-radius:15px;margin-bottom:20px}.total strong{font-size:40px;display:block}.total small{color:#cfddd5}.steps{display:flex;gap:8px;margin:24px 0}.steps span{flex:1;padding:12px;border-bottom:3px solid var(--line);font-size:13px}.steps .on{border-color:var(--green);font-weight:700}.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}.intro{background:var(--green);color:white;padding:9vw;display:flex;flex-direction:column;justify-content:center}.intro h1{font:46px/1.15 Georgia,serif;margin:24px 0}.intro p{color:#cfddd5}.auth{display:grid;place-items:center;padding:35px}.auth form{width:100%;max-width:390px}.auth .logo{width:260px;height:180px}details{padding:14px 0;border-bottom:1px solid var(--line)}summary{cursor:pointer;font-weight:600}.error{color:#9e3434}.empty{text-align:center;padding:45px;color:var(--muted)}#toast{position:fixed;bottom:22px;right:22px;background:var(--green);color:white;padding:14px 24px;border-radius:10px;z-index:20;max-width:90vw}.report-head{display:flex;justify-content:space-between;border-bottom:2px solid var(--gold);margin-bottom:24px}.report-head .logo{margin:0;width:180px}.sign{margin-top:60px;border-top:1px solid var(--ink);padding-top:10px;max-width:300px}.mobile{display:none}a{color:var(--green)}@media(max-width:1000px){.metrics{grid-template-columns:1fr}.shell{grid-template-columns:210px 1fr}main{padding:24px}.grid{gap:12px}.metric strong{font-size:25px}}@media(max-width:740px){.shell{display:block}.sidebar{display:none;position:fixed;z-index:10;width:245px;box-shadow:0 0 0 100vmax #0007}.sidebar.open{display:flex}.mobile{display:block}.grid{grid-template-columns:1fr}.login{display:block}.intro{padding:35px}.intro h1{font-size:32px}.topbar{padding:16px}.topbar .muted{display:none}main{padding:20px}.row{flex-wrap:wrap}h1{font-size:27px}.total strong{font-size:32px}.steps span{padding:8px;font-size:11px}}@media print{body{background:white;color:black}.sidebar,.topbar,.no-print,#toast{display:none!important}.shell{display:block}main{padding:0;max-width:none}.card{border:0;padding:0}.total{background:white;color:black;border:1px solid #aaa;padding:16px}.total small{color:#333}table{font-size:11px}tr{break-inside:avoid}.note{background:white}.report-head{display:flex}@page{size:letter;margin:16mm}}

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'L '+Number(n).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2}),round=n=>Math.round((n+Number.EPSILON)*100)/100;
const empty=()=>({code:'',name:'',identity:'',position:'',department:'',contract:'Indefinido',start:'',end:'',salary:'',unit:'monthly',reason:'Despido injustificado',noticeServed:0,vacUsed:0,paid13:0,paid14:0,notes:''});
let db={version:1,settings:{company:'Librería J. Coello',responsible:'Recursos Humanos',address:'San Pedro Sula, Honduras'},records:[],draft:empty(),session:false},storageOK=true;
try{const saved=localStorage.getItem(KEY);if(saved){const v=JSON.parse(saved);if(!validDB(v))throw Error('Formato inválido');db=v}}catch(e){storageOK=false}
let page='home',step=0,current=null,editId=null,search='';
function validData(d){return d&&typeof d==='object'&&['code','name','identity','position','department','contract','start','end','reason','unit'].every(k=>typeof d[k]==='string')&&['salary','noticeServed','vacUsed','paid13','paid14'].every(k=>Number.isFinite(Number(d[k]))&&Number(d[k])>=0)}
function validDB(v){return v&&v.version===1&&v.settings&&['company','responsible','address'].every(k=>typeof v.settings[k]==='string')&&Array.isArray(v.records)&&v.records.length<=10000&&v.records.every(r=>typeof r.id==='string'&&validData(r.data))&&validData(v.draft)}
function persist(){try{if(!storageOK)throw Error();localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('No se pudo guardar en este navegador. Exporte un respaldo antes de cerrar.');return false}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').hidden=true,5000)}
function icon(i){const paths=['M3 10 12 3l9 7v11h-6v-7H9v7H3z','M12 5v14M5 12h14','M4 5h16v16H4zM8 9h8M8 13h8M8 17h5','M5 3h14v18H5zM8 7h8M8 11h8M8 15h5','M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v3M12 19v3M2 12h3M19 12h3','M10 4H4v16h6M14 8l4 4-4 4M8 12h10'];return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${paths[i]}"/></svg>`}
function nav(p){page=p;$('.sidebar')?.classList.remove('open');render()}
function newCalc(){if(page==='new'&&!confirm('¿Limpiar el formulario actual?'))return;db.draft=empty();editId=null;current=null;step=0;persist();nav('new')}
function render(){if(!db.session)return login();const navs=[['home','Inicio',0],['new','Nuevo cálculo',1],['history','Historial',2],['rules','Reglas y fórmulas',3]];$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><img class="logo" src="${LOGO}" alt="Librería J. Coello"><div class="eyebrow" style="margin:0 12px 20px">Gestión de personal</div><nav class="nav">${navs.map(([p,t,i])=>`<button class="${page===p?'active':''}" onclick="nav('${p}')">${icon(i)}${t}</button>`).join('')}</nav><nav class="nav bottom"><button onclick="nav('settings')">${icon(4)}Configuración</button><button onclick="logout()">${icon(5)}Cerrar sesión</button></nav><small style="padding:12px">Coello · Prestaciones<br>Versión 1.1</small></aside><div><header class="topbar"><button class="mobile" onclick="$('.sidebar').classList.toggle('open')">Menú</button><b>Prestaciones laborales</b><div class="row"><span class="muted">${esc(db.settings.responsible)}</span><span class="avatar">JC</span></div></header><main id="main"></main></div></div>`;({home:home,new:formPage,history:history,rules:rules,settings:settings,result:result,report:report}[page]||home)();}
function login(){$('#app').innerHTML=`<div class="login"><section class="intro"><span class="eyebrow">GRUPO CORPORATIVO COELLO</span><h1>Cada etapa laboral,<br>con cuentas claras.</h1><p>Calcule, revise y conserve las prestaciones de su equipo en un solo lugar.</p><div style="margin-top:30px;border-top:1px solid #ffffff33;padding-top:20px">Recursos Humanos · Honduras</div></section><section class="auth"><form onsubmit="event.preventDefault();enter()"><img class="logo" src="${LOGO}" alt="Librería J. Coello"><div class="eyebrow">Bienvenido</div><h2>Ingresar al programa</h2><p class="muted">Acceso de demostración para uso académico.</p><label for="user">Usuario</label><input id="user" required autocomplete="username" value="admin"><label for="pass" style="margin-top:16px">Contraseña</label><input id="pass" type="password" required autocomplete="current-password"><p><small>Usuario: admin · Contraseña: Coello2026</small></p><button class="primary" style="width:100%">Ingresar</button><p class="muted" style="font-size:12px;margin-top:20px">Los datos se conservan en este navegador. Este acceso local no protege los datos como una cuenta en un servidor.</p></form></section></div>`}
function enter(){if($('#user').value==='admin'&&$('#pass').value==='Coello2026'){db.session=true;persist();render();if(!storageOK)toast('Almacenamiento no disponible o datos dañados. Importe un respaldo.')}else toast('Usuario o contraseña incorrectos.')}
function logout(){db.session=false;persist();render()}
function heading(k,t,p=''){$('#main').innerHTML=`<div class="eyebrow">${esc(k)}</div><h1>${esc(t)}</h1><p class="muted">${esc(p)}</p>`}
function home(){heading('Panel general','Bienvenido a Coello','Sus liquidaciones, organizadas y disponibles cuando las necesite.');const total=db.records.reduce((s,r)=>{const c=calculate(r.data);return s+(c.pending?0:c.total)},0);$('#main').innerHTML+=`<div class="actions"><button class="primary" onclick="newCalc()">+ Nuevo cálculo</button><button onclick="nav('history')">Ver historial</button></div><div class="metrics"><div class="card metric"><small>Liquidaciones guardadas</small><strong>${db.records.length}</strong><span class="muted">Registros en este navegador</span></div><div class="card metric"><small>Empleados registrados</small><strong>${new Set(db.records.map(r=>r.data.identity)).size}</strong><span class="muted">Identidades únicas</span></div><div class="card metric"><small>Total calculado</small><strong>${money(total)}</strong><span class="muted">Solo liquidaciones completas; no indica pagos</span></div></div><div class="card"><div class="row"><h2>Últimos cálculos</h2><span class="pill">Liquidaciones</span></div>${recordTable(db.records.slice().reverse().slice(0,5))}</div><div class="note">Revise los datos del empleado y el motivo de salida antes de emitir el reporte.</div>`}
function field(key,label,type='text',extra=''){return `<div class="field"><label for="f_${key}">${label}</label><input id="f_${key}" name="${key}" type="${type}" value="${esc(key==='identity'?maskIdentity(db.draft[key]):db.draft[key])}" ${extra}></div>`}
function select(key,label,opts){return `<div class="field"><label for="f_${key}">${label}</label><select id="f_${key}" name="${key}" required>${opts.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${db.draft[key]===v?'selected':''}>${esc(t)}</option>`}).join('')}</select></div>`}
function today(){const d=new Date();return date(d.getFullYear(),d.getMonth()+1,d.getDate())}
function identityDigits(v){return String(v).replace(/\D/g,'').slice(0,13)}
function maskIdentity(v){const n=identityDigits(v);return n.slice(0,4)+(n.length>4?'-'+n.slice(4,8):'')+(n.length>8?'-'+n.slice(8):'')}
function maskInput(el){const pos=el.selectionStart,count=identityDigits(el.value.slice(0,pos)).length;el.value=maskIdentity(el.value);let i=0,n=0;while(i<el.value.length&&n<count){if(/\d/.test(el.value[i]))n++;i++}el.setSelectionRange(i,i)}
function catalog(key,label,values){const old=db.draft[key];return select(key,label,[['','Seleccione una opción'],...values,...(old&&!values.includes(old)?[old]:[])])}
function capture(){const f=$('#calcForm');if(!f)return;for(const [k,v] of new FormData(f))db.draft[k]=k==='identity'?identityDigits(v):v;persist()}
function formPage(){heading('Nueva liquidación',editId?'Editar cálculo':'Calcular prestaciones','Complete los datos del empleado y revise el desglose antes de guardar.');$('#main').innerHTML+=`<div class="steps">${['Empleado','Salario','Revisión'].map((t,i)=>`<span class="${step===i?'on':''}">${i+1}. ${t}</span>`).join('')}</div><form id="calcForm" class="card" onsubmit="event.preventDefault();nextStep()"><div id="fields"></div><div class="actions"><button type="button" onclick="backStep()" ${step===0?'disabled':''}>Anterior</button><button class="primary">${step===2?'Calcular prestaciones':'Continuar'}</button><button type="button" onclick="newCalc()">Limpiar</button></div><small>Borrador guardado automáticamente en este navegador.</small></form>`;
let s='';if(step===0)s=`<h2>Datos del empleado</h2><div class="grid">${field('code','Código del empleado','text','required maxlength="30"')}${field('name','Nombre completo','text','required maxlength="120"')}${field('identity','Número de identidad','text','required inputmode="numeric" pattern="[0-9]{4}-[0-9]{4}-[0-9]{5}" maxlength="15" placeholder="0512-2003-00736" oninput="maskInput(this)"')}${catalog('position','Puesto',['Gerente general','Administrador','Contador','Auxiliar contable','Jefe de Recursos Humanos','Asistente de Recursos Humanos','Jefe de tienda','Vendedor','Cajero','Encargado de bodega','Auxiliar de bodega','Analista de sistemas','Soporte técnico','Conductor','Personal de limpieza','Guardia de seguridad'])}${catalog('department','Departamento',['Gerencia','Administración','Contabilidad y Finanzas','Recursos Humanos','Ventas','Caja','Bodega e Inventario','Compras','Sistemas y Tecnología','Logística','Servicios Generales','Seguridad'])}${select('contract','Tipo de contrato',['Indefinido','Plazo fijo','Obra determinada'])}${field('start','Fecha de ingreso','date',`required max="${today()}"`)}${field('end','Fecha de salida','date','required')}${select('reason','Motivo de terminación',['Despido injustificado','Renuncia voluntaria','Despido justificado','Mutuo acuerdo','Fin de contrato'])}</div><div class="note">El cálculo automático de preaviso y cesantía se limita a contrato indefinido con despido injustificado. Otros supuestos se marcan para revisión y no generan indemnización automática.</div>`;
if(step===1)s=`<h2>Salario ordinario</h2><div class="grid">${select('unit','Salario proporcionado',[['monthly','Mensual'],['daily','Diario']])}${field('salary','Monto en lempiras','number','required min="0.01" max="100000000" step="0.01"')}</div><div id="bases"></div><label for="f_notes">Observaciones</label><textarea id="f_notes" name="notes" rows="3" maxlength="1500">${esc(db.draft.notes)}</textarea>`;
if(step===2){const d=db.draft,b=bases(d),a=age(d.start,d.end);s=`<h2>Revise la información</h2><div class="grid"><div><h3>${esc(d.name)}</h3><p>${esc(d.code)} · ${esc(maskIdentity(d.identity))}<br>${esc(d.position)} · ${esc(d.department)}</p><span class="pill">${esc(d.contract)}</span></div><div><p>Ingreso: <b>${fmt(d.start)}</b><br>Salida: <b>${fmt(d.end)}</b><br>Antigüedad: <b>${a.y} años, ${a.m} meses, ${a.d} días</b><br>Motivo: <b>${esc(d.reason)}</b></p></div></div>${basesHTML(b)}`}$('#fields').innerHTML=s;$('#calcForm').addEventListener('input',()=>{capture();if(step===1)$('#bases').innerHTML=basesHTML(bases(db.draft))});$('#calcForm').addEventListener('change',capture);if(step===1)$('#bases').innerHTML=basesHTML(bases(db.draft));}
function nextStep(){capture();if(step===0&&db.draft.start>today())return toast('La fecha de ingreso no puede ser posterior a hoy.');if(step===0&&(!validDate(db.draft.start)||!validDate(db.draft.end)||db.draft.end<=db.draft.start))return toast('La salida debe ser posterior al ingreso.');if(step<2){step++;formPage()}else{const err=validate(db.draft);if(err)return toast(err);current=structuredClone(db.draft);nav('result')}}
function backStep(){capture();step=Math.max(0,step-1);formPage()}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s))&&new Date(s+'T00:00:00Z').toISOString().slice(0,10)===s}
function validate(d){if(!validData(d)||!d.name.trim()||!d.code.trim()||!d.department.trim()||!d.position.trim()||!/^\d{13}$/.test(d.identity))return 'Complete correctamente los datos del empleado.';if(d.start>today())return 'La fecha de ingreso no puede ser posterior a hoy.';if(!validDate(d.start)||!validDate(d.end)||d.end<=d.start)return 'Revise las fechas de ingreso y salida.';if(+d.salary<=0||+d.salary>1e8)return 'Ingrese un salario positivo válido.';if(+d.noticeServed>60||+d.vacUsed>20)return 'Revise los días de preaviso y vacaciones.';return ''}
function bases(d){let mo=+d.salary*(d.unit==='daily'?30:1);return {mo,di:mo/30,ma:mo*14/12,da:mo*14/360}}
function basesHTML(b){return `<div class="table-wrap"><table><thead><tr><th>Diario ordinario</th><th>Mensual ordinario</th><th>Diario promediado</th><th>Mensual promediado</th></tr></thead><tbody><tr>${[b.di,b.mo,b.da,b.ma].map(v=>`<td>${money(v)}</td>`).join('')}</tr></tbody></table></div>`}
// Mes comercial: 30 días. Se conserva la precisión hasta redondear cada prestación.
function age(a,b){const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);let y=y2-y1,m=m2-m1,d=Math.min(d2,30)-Math.min(d1,30);if(d<0){d+=30;m--}if(m<0){m+=12;y--}return {y,m,d}}
function days(a,b,inc=false){let t=age(a,b);return Math.max(0,t.y*360+t.m*30+t.d+(inc?1:0))}
function date(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function anniversary(d){const [,m,day]=d.start.split('-').map(Number),y=+d.end.slice(0,4);return date(y,m,Math.min(day,new Date(Date.UTC(y,m,0)).getUTCDate()))}
function fmt(s){return s?s.split('-').reverse().join('/'):'—'}
function calculate(d){d={...d,noticeServed:0,vacUsed:0,paid13:0,paid14:0};const b=bases(d),t=age(d.start,d.end),n=t.y*360+t.m*30+t.d,eligible=d.contract==='Indefinido'&&d.reason==='Despido injustificado',pre=n<90?1:n<180?7:n<360?14:n<=720?30:60;let rows=[];const add=(name,gross,paid,formula,period,why='')=>rows.push({name,gross:round(gross),paid:round(paid),value:round(Math.max(0,gross-paid)),formula,period,why});
add('Preaviso',eligible?pre*b.da:0,eligible?Math.min(pre,+d.noticeServed)*b.da:0,`${pre} días * ${money(b.da)}`,'Según antigüedad',eligible?'':'No se genera automáticamente por el contrato o motivo seleccionado.');
let cy=Math.min(25,t.y),short=n<90?0:n<=180?10:20;add('Auxilio de cesantía',eligible?(t.y?cy*b.ma:short*b.da):0,0,t.y?`${cy} años * ${money(b.ma)}`:`${short} días * ${money(b.da)}`,`${t.y} años completos · tope 25 sueldos`,eligible?'':'No se genera automáticamente por el contrato o motivo seleccionado.');
let cp=t.y>=1&&t.y<25?(t.m<3?0:t.m<=6?10:20):0;add('Cesantía proporcional',eligible?cp*b.da:0,0,`${cp} días * ${money(b.da)}; se consideran ${t.m} meses completos`,'Remanente después de años completos',t.y>=25?'No corresponde: se alcanzó el tope de 25 sueldos.':!eligible?'No se genera por el contrato o motivo seleccionado.':cp===0?'No corresponde según los meses completos acumulados.':'');
const [ey,em]=d.end.split('-').map(Number),p13=[d.start,date(ey,1,1)].sort().pop(),p14=[d.start,date(em>=7?ey:ey-1,7,1)].sort().pop(),pv=anniversary(d),td13=Math.min(360,days(p13,d.end,true)),td14=Math.min(360,days(p14,d.end,true)),tdv=days(pv,d.end),vd=t.y<1?10:t.y===1?10:t.y===2?12:t.y===3?15:20;
const vp=age(pv,d.end),earned=tdv/360*vd;
add('Vacaciones proporcionales',earned*b.di,0,`Tiempo proporcional: ${pv>d.end?'0 meses y 0 días':vp.m+' meses y '+vp.d+' días'}. TDT: ${tdv} días. Escala por antigüedad: ${vd} días anuales. Días proporcionales: (${tdv} / 360) * ${vd} = ${earned.toFixed(2)} días. Importe: ${earned.toFixed(2)} días * SDO ${money(b.di)} = ${money(earned*b.di)}.`,`${fmt(pv)} al ${fmt(d.end)}`,pv>d.end?'La fecha base de vacaciones es posterior a la salida. Revise este caso antes de emitir el reporte.':'');
add('Treceavo mes (aguinaldo)',td13/360*b.mo,+d.paid13,`(${td13} / 360) * ${money(b.mo)}`,`${fmt(p13)} al ${fmt(d.end)}`);
add('Catorceavo mes',td14/360*b.mo,+d.paid14,`(${td14} / 360) * ${money(b.mo)}`,`${fmt(p14)} al ${fmt(d.end)}`);
return {b,t,rows,pending:pv>d.end,total:round(rows.reduce((s,r)=>s+r.value,0))}}
function result(){if(!current)return nav('new');const c=calculate(current);heading('Resultado del cálculo',current.name,`${c.t.y} años, ${c.t.m} meses y ${c.t.d} días · ${esc(current.reason)}`);$('#main h1').textContent=current.name;$('#main').innerHTML+=`<div class="total"><small>TOTAL DE PRESTACIONES A PAGAR</small><strong>${c.pending?'Pendiente de revisión':money(c.total)}</strong><small>Valores en lempiras</small></div><div class="card">${resultTable(c)}<h3 style="margin-top:25px">Procedimiento de cálculo</h3>${c.rows.map(r=>`<details><summary>${r.name} · ${c.pending&&r.name==='Vacaciones proporcionales'?'Pendiente':money(r.value)}</summary><p>${r.period}</p><p>${r.formula}</p>${r.why?`<p class="muted">${r.why}</p>`:''}${r.paid>r.gross?'<p class="error">Lo reconocido supera lo generado. Revise el dato; el saldo se muestra en cero.</p>':''}</details>`).join('')}</div><div class="actions"><button class="primary" onclick="saveRecord()">Guardar cálculo</button><button onclick="editCurrent()">Editar datos</button><button onclick="nav('report')">Ver reporte / PDF</button><button onclick="newCalc()">Nuevo cálculo</button></div><div class="note">No se incluyen deudas de períodos anteriores ni indemnizaciones especiales. Los importes usan precisión completa y se redondean a dos decimales al final de cada prestación.</div>`}
function resultTable(c){return `<div class="table-wrap"><table><thead><tr><th>Prestación</th><th class="money">A pagar</th></tr></thead><tbody>${c.rows.map(r=>`<tr><td><b>${r.name}</b>${r.why?`<br><small>${r.why}</small>`:''}</td><td class="money"><b>${c.pending&&r.name==='Vacaciones proporcionales'?'Pendiente':money(r.value)}</b></td></tr>`).join('')}<tr><td><b>Total a pagar</b></td><td class="money"><b>${c.pending?'Pendiente':money(c.total)}</b></td></tr></tbody></table></div>`}

function editCurrent(){db.draft=structuredClone(current);step=0;persist();nav('new')}
function saveRecord(){if(calculate(current).pending)return toast('Revise el período de vacaciones antes de guardar la liquidación.');const duplicate=db.records.find(r=>r.id!==editId&&r.data.identity===current.identity&&r.data.start===current.start&&r.data.end===current.end);if(duplicate)return toast('Ya existe una liquidación para esta identidad y período. Edítela desde el historial.');const next=structuredClone(db),id=editId||('LC-'+Date.now().toString(36).toUpperCase()),idx=next.records.findIndex(r=>r.id===id);let r={id,data:structuredClone(current),updated:new Date().toISOString()};if(idx>=0)next.records[idx]=r;else next.records.push(r);const old=db;db=next;if(persist()){editId=id;toast('Cálculo guardado correctamente.')}else db=old}
function recordTable(rs){return rs.length?`<div class="table-wrap"><table><thead><tr><th>Empleado</th><th>Salida</th><th class="money">Total</th><th>Acciones</th></tr></thead><tbody>${rs.map(r=>`<tr><td><b>${esc(r.data.name)}</b><br><small>${esc(r.data.code)} · ${esc(r.id)}</small></td><td>${fmt(r.data.end)}</td><td class="money">${calculate(r.data).pending?'Pendiente':money(calculate(r.data).total)}</td><td><button data-open="${esc(r.id)}">Ver</button> <button data-delete="${esc(r.id)}" aria-label="Eliminar cálculo de ${esc(r.data.name)}">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay cálculos guardados.<br>Comience con una nueva liquidación.</div>'}
document.addEventListener('click',e=>{const o=e.target.closest('[data-open]'),del=e.target.closest('[data-delete]');if(o){const r=db.records.find(x=>x.id===o.dataset.open);current=structuredClone(r.data);editId=r.id;nav('result')}if(del&&confirm('¿Eliminar esta liquidación del historial? Esta acción no se puede deshacer.')){const old=db.records;db.records=db.records.filter(r=>r.id!==del.dataset.delete);if(!persist())db.records=old;render()}});
function history(){heading('Archivo de liquidaciones','Historial','Busque, revise y actualice los cálculos guardados.');$('#main').innerHTML+=`<div class="card"><label for="search">Buscar por nombre, código o identidad</label><input id="search" value="${esc(search)}" placeholder="Buscar empleado…" oninput="search=this.value;filterHistory()"><div id="records"></div></div><div class="actions"><button onclick="exportBackup()">Exportar respaldo JSON</button><button class="primary" onclick="newCalc()">Nuevo cálculo</button></div>`;filterHistory()}
function filterHistory(){const q=search.toLowerCase();$('#records').innerHTML=recordTable(db.records.filter(r=>[r.data.name,r.data.code,r.data.identity].some(s=>s.toLowerCase().includes(q))).slice().reverse())}
function report(){if(!current)return nav('home');if(calculate(current).pending){toast('El período de vacaciones requiere revisión antes de emitir el reporte.');return nav('result')}let c=calculate(current);heading('Documento de liquidación','Reporte de prestaciones');$('#main').innerHTML=`<div class="actions no-print"><button onclick="nav('result')">Volver al resultado</button><button class="primary" onclick="window.print()">Imprimir / Guardar como PDF</button></div><article class="card"><div class="report-head"><div><span class="eyebrow">${esc(db.settings.company)}</span><h2>Liquidación de prestaciones</h2><p>${esc(db.settings.address)}<br><small>${editId?esc(editId):'Borrador sin guardar'} · Emitido: ${new Date().toLocaleDateString('es-HN')}</small></p></div><img class="logo" src="${LOGO}" alt="Logo Coello"></div><div class="grid"><p><b>${esc(current.name)}</b><br>Identidad: ${esc(maskIdentity(current.identity))}<br>Código: ${esc(current.code)}<br>${esc(current.position)} · ${esc(current.department)}</p><p>Ingreso: ${fmt(current.start)}<br>Salida: ${fmt(current.end)}<br>Antigüedad: ${c.t.y} años, ${c.t.m} meses, ${c.t.d} días<br>${esc(current.contract)} · ${esc(current.reason)}</p></div>${basesHTML(c.b)}<h3 style="margin-top:20px">Detalle de prestaciones</h3>${resultTable(c)}<h3 style="margin-top:20px">Fórmulas aplicadas</h3>${c.rows.map(r=>`<p style="font-size:12px"><b>${r.name}:</b> ${r.formula}<br><span class="muted">${r.period}${r.why?' · '+r.why:''}</span></p>`).join('')}<p>${esc(current.notes||'Sin observaciones adicionales.')}</p><div class="sign">${esc(db.settings.responsible)}<br><small>Responsable de elaboración</small></div></article>`}
function rules(){heading('Guía de consulta','Reglas y fórmulas','Bases salariales, períodos y procedimientos de cálculo.');
const table=(heads,rows)=>`<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const formula=t=>`<div class="formula">${t}</div>`;
$('#main').innerHTML+=`
<section class="card"><span class="eyebrow">01 · Salarios</span><h2>Las cuatro bases salariales</h2>${table(['Base','Fórmula'],[['Mensual ordinario (SMO)','SDO * 30'],['Diario ordinario (SDO)','SMO / 30'],['Mensual promediado (SMP)','SMO * 14 / 12'],['Diario promediado (SDP)','SMP / 30']])}<p class="rule-note">Preaviso y cesantía utilizan salario promediado. Vacaciones, aguinaldo y catorceavo utilizan salario ordinario.</p></section>
<section class="card"><span class="eyebrow">02 · Preaviso</span><h2>Días según la antigüedad</h2>${table(['Tiempo trabajado','Días de salario'],[['Menos de 3 meses','1'],['Desde 3 hasta menos de 6 meses','7'],['Desde 6 hasta menos de 12 meses','14'],['Desde 1 hasta 2 años exactos','30'],['Más de 2 años','60']])}${formula('Preaviso = días correspondientes * SDP')}</section>
<section class="card"><span class="eyebrow">03 · Cesantía</span><h2>Auxilio de cesantía</h2>${formula('Cesantía = años completos * SMP')}<p><b>Límite:</b> 25 sueldos mensuales en total. Al alcanzar el límite, no se suma cesantía proporcional.</p>${table(['Antigüedad menor a un año','Días de salario promediado'],[['Menos de 3 meses','0'],['De 3 a 6 meses','10'],['Más de 6 y menos de 12 meses','20']])}</section>
<section class="card"><span class="eyebrow">04 · Fracción de cesantía</span><h2>Cesantía proporcional</h2><p>Aplica después de un año completo y antes del límite de 25 sueldos. Se consideran únicamente los meses completos restantes.</p>${table(['Meses restantes','Días correspondientes'],[['Menos de 3','0'],['De 3 a 6','10'],['De 7 a 11','20']])}${formula('Cesantía proporcional = días correspondientes * SDP')}</section>
<section class="card"><span class="eyebrow">05 · Vacaciones</span><h2>Vacaciones proporcionales</h2><ol><li>Se asumen pagadas las vacaciones de períodos anteriores.</li><li>Se toma el día y mes de ingreso, con el año de salida.</li><li>Se calculan los meses y días transcurridos desde esa fecha hasta la salida.</li><li>Se seleccionan los días anuales según los años completos de servicio.</li></ol>${table(['Años completos','Días anuales'],[['Menos de 1 año y 1 año','10'],['2 años','12'],['3 años','15'],['4 años o más','20']])}${formula('TDT = meses * 30 + días')}${formula('Días proporcionales = (TDT / 360) * días anuales')}${formula('Vacaciones = días proporcionales * SDO')}<p class="rule-note">No se agrega un día al TDT. Los días proporcionales se muestran con dos decimales; el importe usa la precisión completa. Si la fecha base queda después de la salida, el sistema deja la liquidación pendiente y solicita revisar el caso, sin trasladarlo automáticamente al año anterior.</p></section>
<section class="card"><span class="eyebrow">06 · Bonificaciones anuales</span><h2>Aguinaldo y catorceavo</h2>${table(['Prestación','Inicio del período'],[['Aguinaldo','1 de enero del año de salida'],['Catorceavo','1 de julio del ciclo vigente']])}<p>Si el empleado ingresó después del inicio del período, se usa su fecha de ingreso.</p>${formula('TDT = meses * 30 + días + 1')}${formula('Importe proporcional = (TDT / 360) * SMO')}<p class="rule-note">Máximo 360 días por período. Se asumen pagados los períodos anteriores.</p></section>
<section class="card"><span class="eyebrow">07 · Criterios y alcance</span><h2>Consideraciones del cálculo</h2><ul><li>Año comercial de 360 días y meses de 30 días; el día 31 se trata como 30.</li><li>Se redondea cada prestación a dos decimales y luego se suma.</li><li>No se aplican deducciones por pagos reconocidos en el período actual.</li><li>Preaviso y cesantía automáticos: contrato indefinido y despido injustificado.</li><li>No se incluyen salarios pendientes, deudas de años anteriores ni indemnizaciones especiales.</li></ul><div class="note">Este programa conserva las convenciones acordadas para los ejercicios de clase. Los tramos de cesantía proporcional no equivalen al prorrateo legal después de un año. Otros motivos de salida y derechos especiales requieren revisión.</div><h3>Referencias de consulta</h3><p><a href="https://www.tsc.gob.hn/web/leyes/codigo_de_trabajo.pdf" target="_blank" rel="noopener">Código del Trabajo de Honduras</a></p><p><a href="https://consulta.trabajo.gob.hn/calculo/add-calculop.aspx" target="_blank" rel="noopener">Consulta de cálculo de la Secretaría de Trabajo</a></p></section>`}

function settings(){heading('Preferencias del programa','Configuración','Datos de la empresa y respaldo de información.');$('#main').innerHTML+=`<form class="card" onsubmit="event.preventDefault();saveSettings(this)"><h2>Datos del reporte</h2>${['company','responsible','address'].map((k,i)=>`<div class="field"><label for="s_${k}">${['Empresa','Responsable de elaboración','Dirección'][i]}</label><input id="s_${k}" name="${k}" value="${esc(db.settings[k])}" required maxlength="150"></div>`).join('')}<button class="primary">Guardar configuración</button></form><div class="card"><h2>Respaldo de datos</h2><p>La información permanece en localStorage de este navegador y equipo. Borrar los datos del navegador también elimina estos registros. Conserve el mismo archivo y navegador para mantener el acceso.</p><div class="actions"><button onclick="exportBackup()">Descargar respaldo JSON</button><button onclick="$('#import').click()">Importar respaldo</button><input id="import" type="file" accept=".json,application/json" hidden onchange="importBackup(this.files[0]);this.value=''" style="display:none"></div><small>El respaldo incluye historial, borrador y configuración. Importar reemplaza los datos actuales, previa confirmación.</small></div>`}
function saveSettings(f){let old=db.settings;db.settings=Object.fromEntries(new FormData(f));if(persist()){toast('Configuración guardada.');render()}else db.settings=old}
function exportBackup(){const data=JSON.stringify({...db,session:false},null,2),a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.href=url;a.download='Coello_Respaldo_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importBackup(f){if(!f)return;try{if(f.size>4000000)throw Error();const v=JSON.parse(await f.text());if(!validDB(v)||v.records.some(r=>validate(r.data))||new Set(v.records.map(r=>r.id)).size!==v.records.length)throw Error();if(!confirm(`¿Reemplazar la información actual con ${v.records.length} liquidaciones del respaldo? Exporte antes su respaldo si desea conservarla.`))return;const old=db;db=v;db.session=true;storageOK=true;if(persist()){current=null;editId=null;toast('Respaldo importado.');nav('home')}else db=old}catch(e){toast('Archivo inválido. Seleccione un respaldo JSON generado por este programa.')}}
render();
</script></body></html>
